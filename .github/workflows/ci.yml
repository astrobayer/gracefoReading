# Continuous integration for the gracefoReading toolbox.
#
# Both operating systems are tested because the two defects found after
# a release (Java gzip pass-by-value, Windows CRLF line endings) were
# platform-specific and invisible on the other platform.
#
# Setup, licensing and self-hosted runners: see docs/CI_SETUP.md
#
# Developed by Matthias Weigelt with the help of Anthropic Claude Opus 5,
# 2026-08-14.

name: ci

on:
  # push limited to main. An unrestricted branch list next to
  # pull_request fires BOTH events for every commit on a branch with
  # an open PR, so the suite ran twice against the same tree. On a
  # single self-hosted runner the second run queues behind the first.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly run catches breakage introduced by new MATLAB releases
    - cron: '17 5 * * 1'

# One run per ref: a quick second push releases the only runner
# instead of leaving a superseded run holding it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matlab-tests:
    name: MATLAB suite
    runs-on: [self-hosted, Windows]
    steps:
      # PINS MOVED 2026-09-20, because the runner asked. Run 35450953746
      # ended green with:
      #   ##[warning]Node.js 20 is deprecated. The following actions target
      #   Node.js 20 but are being forced to run on Node.js 24:
      #   actions/checkout@11d5960a..., actions/setup-python@a26af69b...
      # checkout moved to the v6 SHA README.md of ci-actions carries;
      # run-command moved from the v2 SHA to the v3 SHA this same file
      # already ran at the Code Analyzer step, which the runner did not flag.
      #
      # THE LAST TWO MOVED 2026-09-20, once their SHAs could be verified
      # against the upstream repositories rather than guessed:
      #   setup-python   v5 -> v6. node20 -> node24 is its ONLY breaking
      #                  change, and it runs here on ubuntu-latest.
      #   upload-artifact v4 -> v6. v5 is STILL node20 - measured, not
      #                  assumed - so v6 is the first major that fixes
      #                  anything. Its README warns that self-hosted runners
      #                  may need additional firewall rules, and this step
      #                  runs on the self-hosted machine, so the pull request
      #                  that moved it was the experiment.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The probe and the reasoning behind it live in
      # astrobayer/ci-actions. Six repositories carried this step
      # byte-for-byte identically, and a copied step is what let one
      # editing mistake cost three repositories a checkout each.
      #
      # PINNED TO AN IMMUTABLE TAG, not @v1 and not @main: a moving tag
      # would let a commit in ci-actions change this repository's CI with
      # nothing in its diff to explain it.
      #
      # timeout-minutes sits here and not in the action: GitHub's
      # composite-action schema rejects the key on a step.
      - uses: astrobayer/ci-actions/matlab-probe@v1.2.0
        timeout-minutes: 2

      # The five large PO.DAAC products (ACT1B, GNV1B, SCA1B, KBR1B,
      # LRI1B, ~60 MB) are too large to bundle, so six acceptance points
      # skipped themselves on every run so far. A self-hosted machine
      # can hold them once.
      #
      # THE PATH IS NOT IN THIS FILE. It comes from the repository or
      # the organisation variable READING_DATA_POOL, so the mechanism is
      # version controlled while the machine-specific location is not.
      # Unset variable: the step skips and the suite filters exactly as
      # before.
      #
      # G-07 (issue #23): the variable is the DATAPOOL ROOT, and the day
      # fixtures live below it in RawData\tests\realdata. The repository
      # value pointed straight at the fixture folder, so BOTH are tried,
      # root layout first, for exactly one release - and the step prints
      # WHICH of the two answered each file. Without that, deleting the
      # repository variable would look identical whether the switch
      # worked or the fallback carried it.
      #
      # Reported as a named list, because a missing pool and a pool with
      # the wrong layout produce the same skipped points further down and
      # are otherwise indistinguishable.
      - name: Report which real-data files the pool provides
        if: ${{ vars.READING_DATA_POOL != '' }}
        timeout-minutes: 2
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          READING_DATA_POOL: ${{ vars.READING_DATA_POOL }}
        with:
          command: |
            pool = string(getenv("READING_DATA_POOL"));
            assert(isfolder(pool), 'gracefoReading:ci:dataPoolMissing', ...
                'READING_DATA_POOL points at %s, which is not a folder.', pool);
            fixtures = fullfile(pool, "RawData", "tests", "realdata");
            fprintf('pool root : %s\n', pool);
            fprintf('fixtures  : %s\n', fixtures);
            want = ["ACT1B_2020-01-01_C_04.txt"
                    "GNV1B_2020-01-01_C_04.txt"
                    "SCA1B_2020-01-01_C_04.txt"
                    "KBR1B_2020-01-01_Y_04.txt"
                    "LRI1B_2020-01-01_Y_04.txt"
                    "MAS1B_2020-01-01_C_04.txt"
                    "THR1B_2020-01-01_C_04.txt"
                    "ACH1B_2020-01-01_D_04.txt"
                    "AHK1B_2020-01-01_C_04.txt"
                    "LHK1B_2020-01-01_C_04.txt"
                    "GRACEFO-1_kinematicOrbit_2020-01-01.txt"];
            nFound = 0; nLegacy = 0;
            for k = 1:numel(want)
                cand = [fullfile(fixtures, want(k)), fullfile(pool, want(k))];
                hit = 0;
                for c = 1:numel(cand)
                    if isfile(cand(c)), hit = c; break; end
                end
                if hit == 0
                    fprintf('  ABSENT  %s\n', want(k));
                    continue
                end
                nFound = nFound + 1;
                if hit == 1
                    where = 'RawData\tests\realdata';
                else
                    where = 'pool root (legacy path, goes away next release)';
                    nLegacy = nLegacy + 1;
                end
                d = dir(cand(hit));
                fprintf('  FOUND   %-42s %9d B  [%s]\n', want(k), d.bytes, where);
            end
            fprintf('%d of %d found; %d via the legacy path\n', ...
                nFound, numel(want), nLegacy);

      # The value reaches the suite through the environment and is read
      # by getenv in testRealData.resolvePool, never interpolated into
      # command text: a path containing spaces or backslashes - and this
      # one contains both - cannot break the script.
      - name: Run test suites via the CI entry point
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          READING_DATA_POOL: ${{ vars.READING_DATA_POOL }}
        with:
          command: addpath('ci'); runCI('Exit', true);

      # G-03 / O-7, issue #18. The parse-time number O-7 has waited for
      # has to be measured where a real ACT1B day is, and that is this
      # runner. Deliberately NOT an acceptance point:
      # continue-on-error keeps a slow or busy machine from turning a
      # green suite red, and benchmarkParse itself asserts nothing and
      # returns empty when the pool holds no day file. Its output is
      # read out of this log and recorded in HANDOVER with the run id
      # and the MATLAB release beside it.
      # always(): the previous step is the MATLAB suite, and without it
      # a red suite SKIPS this step - which is exactly what happened on
      # run 35696829972, where the measurement O-7 has waited for was
      # lost to an unrelated test failure.
      - name: Measure readL1b parse time on one real day (G-03)
        if: ${{ always() && vars.READING_DATA_POOL != '' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          READING_DATA_POOL: ${{ vars.READING_DATA_POOL }}
        with:
          command: setupGraceFOReading; addpath('ci'); benchmarkParse;

      - name: Publish test report and coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testresults-self-hosted-windows
          path: artifacts/

  documentation:
    name: Help audit and docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install documentation dependencies
        run: pip install reportlab --quiet

      # Runs first and needs nothing installed. A file that MATLAB
      # cannot parse must not consume the single self-hosted runner.
      - name: Gate - source files parse and carry exactly one help block
        run: python3 docsrc/sourceIntegrity.py

      - name: Audit every help block against the documentation standard
        run: python3 docsrc/auditHelp.py

      - name: Regenerate documentation and verify it is committed in sync
        run: |
          python3 docsrc/generate_docs.py
          # HTML must be byte-identical; the PDF is binary and timestamped
          git diff --exit-code -- html/
